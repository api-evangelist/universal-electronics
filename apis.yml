name: Universal Electronics
description: Universal Electronics Inc. (UEI) is a global leader in universal control
  and sensing technologies for the smart home, known for its QuickSet software platform,
  UEI TIDE smart thermostats and sensors, the Nevo white-label control platform, and
  the One For All retail remote-control brand. QuickSet Cloud provides device discovery,
  interoperability, and entertainment control via a device knowledge graph spanning
  roughly one million devices across 12,000 brands, with web APIs and native SDKs
  (Linux, Android, RDK, Android TV) offered to OEM and service-provider partners through
  a gated developer portal at developer.quicksetcloud.com. Surfaced as a Battery Ventures
  portfolio company; UEI publishes no public self-serve API.
