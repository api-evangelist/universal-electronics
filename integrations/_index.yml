    - Carrier Entry Level and ICP Thermostat
    - Carrier Smart Thermostat Advanced Featuring InteliSense
    - Nevo Butler
    - Tide Touch
    - UE61 Module
    - WiFi Connector
    signal_note: certified_products = one entry per Wi-Fi Alliance product category, never per product, variant
