  type: register
  channel: standard-directory
  evidence: https://www.wi-fi.org/product-finder
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Wi-Fi Alliance product finder (wi-fi.org/product-finder; prf.cert.wi-fi.org public JSON / CSV)
    standard: Wi-Fi CERTIFIED
    spec_file: null
    role: wi-fi-certified-product
    registered_name: Universal Electronics Inc.
    register_id: WFA141999
    matched_domain: null
    matched_by: register-name
    register_name_note: register-name 'universalelectronics' = universal-electronics; no wikidata P856
    certified_products:
    - product: Gaming, Media & Music
      lapsed: false
      newest_certification: '2019-07-23'
      generations:
      - Wi-Fi 7
      - Wi-Fi 6
      - Wi-Fi 5 (ac)
      - Wi-Fi 4 (n)
    - product: Other
      lapsed: false
      newest_certification: '2013-05-13'
      generations:
      - Wi-Fi 7
      - Wi-Fi 6
      - Wi-Fi 5 (ac)
      - Wi-Fi 4 (n)
    - product: Smart Home
      lapsed: false
      newest_certification: '2026-10-09'
      generations:
      - Wi-Fi 7
      - Wi-Fi 6
      - Wi-Fi 5 (ac)
      - Wi-Fi 4 (n)
